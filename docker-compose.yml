services:

  sonicbeat:
    build:
      context: .
      args:
        VITE_SUPABASE_PROJECT_ID: "${VITE_SUPABASE_PROJECT_ID}"
        VITE_SUPABASE_PUBLISHABLE_KEY: "${VITE_SUPABASE_PUBLISHABLE_KEY}"
        VITE_SUPABASE_URL: "${VITE_SUPABASE_URL}"
    container_name: sonicbeat
    ports:
      - "8083:80"
    restart: always
    networks:
      sonicbeat-net:
        ipv4_address: 10.10.0.2
    depends_on:
      - radio-server

  radio-server:
    build:
      context: ./streaming-server
    container_name: radio-server
    ports:
      - "8000:8000"   # Icecast — VLC connects here: http://YOUR_IP:8000/deck-a
    environment:
      # FIX: 127.0.0.1 — Liquidsoap and Icecast are in the SAME container
      # Using "localhost" can fail on some Docker builds; 127.0.0.1 is explicit
      ICECAST_HOST: "127.0.0.1"
      ICECAST_PORT: "8000"
      ICECAST_SOURCE_PASSWORD: "${ICECAST_SOURCE_PASSWORD:-sonicbeat_source_2024}"
      ICECAST_ADMIN_PASSWORD: "${ICECAST_ADMIN_PASSWORD:-sonicbeat_admin_2024}"
      UPLOAD_DIR: "${UPLOAD_DIR:-/data/uploads}"
      LIQ_HOST: "127.0.0.1"
      LIQ_TELNET_PORT: "1234"
      LIQ_HARBOR_PORT: "8005"
    volumes:
      - sonicbeat-data:/data
    restart: always
    networks:
      sonicbeat-net:
        ipv4_address: 10.10.0.3

networks:
  sonicbeat-net:
    name: sonicbeat-net
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24
          gateway: 10.10.0.1

volumes:
  sonicbeat-data:
    name: sonicbeat-data
