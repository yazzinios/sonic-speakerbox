[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

; ── Icecast2 ─────────────────────────────────────────────────────────────────
[program:icecast]
command=/usr/bin/icecast2 -c /etc/icecast2/icecast.xml
user=icecast2
autostart=true
autorestart=true
startretries=10
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── Liquidsoap — wait 6s for Icecast socket to open ─────────────────────────
; fallible=false in radio.liq means Liquidsoap will auto-connect to Icecast
; and keep retrying — no manual out_X.start needed
[program:liquidsoap]
command=/bin/sh -c "sleep 6 && exec /usr/bin/liquidsoap /app/radio.liq"
autostart=true
autorestart=true
startretries=10
startsecs=8
priority=20
environment=ICECAST_HOST="%(ENV_ICECAST_HOST)s",ICECAST_PORT="%(ENV_ICECAST_PORT)s",ICECAST_SOURCE_PASSWORD="%(ENV_ICECAST_SOURCE_PASSWORD)s",UPLOAD_DIR="%(ENV_UPLOAD_DIR)s"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── Node.js API — wait 30s total (Icecast 6s + Liquidsoap ~20s boot) ────────
; Node.js only uses telnet for track control — no startup commands needed
[program:api]
command=/bin/sh -c "sleep 30 && exec /usr/bin/node /app/server.js"
autostart=true
autorestart=true
startretries=5
startsecs=5
priority=30
environment=PORT="3001",ICECAST_HOST="%(ENV_ICECAST_HOST)s",ICECAST_PORT="%(ENV_ICECAST_PORT)s",ICECAST_SOURCE_PASSWORD="%(ENV_ICECAST_SOURCE_PASSWORD)s",UPLOAD_DIR="%(ENV_UPLOAD_DIR)s",LIQ_HOST="127.0.0.1",LIQ_TELNET_PORT="1234",LIQ_HARBOR_PORT="8005"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
